<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS - Gordinho Streaming</title>
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: #141414;
      --primary-red: #E50914;
      --hover-red: #B81D24;
      --text-white: #FFFFFF;
      --text-gray: #AAAAAA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding-bottom: 50px;
    }

    /* Cabeçalho */
    header {
      background-color: rgba(0, 0, 0, 0.9);
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-red);
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--text-white);
      font-size: 16px;
      vertical-align: middle;
      margin-left: 5px;
    }

    /* Painel de Controle (Adicionar por Link) */
    .admin-panel {
      background-color: var(--panel-bg);
      margin: 30px auto;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      border-left: 5px solid var(--primary-red);
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }

    .admin-panel h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      background-color: #222;
      border: 1px solid #444;
      color: var(--text-white);
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary-red);
    }

    button {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--hover-red);
    }

    #statusMsg {
      font-size: 14px;
      margin-top: 8px;
      display: none;
    }

    /* Catálogo */
    .catalog-section {
      padding: 20px 50px;
    }

    .catalog-section h2 {
      margin-bottom: 20px;
      font-size: 24px;
      border-left: 4px solid var(--primary-red);
      padding-left: 10px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .movie-card {
      background-color: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 1px solid #333;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: var(--primary-red);
    }

    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-rating {
      color: #46d369;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
      display: block;
    }

    .movie-desc {
      font-size: 12px;
      color: var(--text-gray);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Player Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .player-box {
      width: 90%;
      max-width: 950px;
      background: #000;
      border: 2px solid var(--primary-red);
      border-radius: 8px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 28px;
      cursor: pointer;
      background: none;
      border: none;
    }

    video {
      width: 100%;
      max-height: 550px;
      border-radius: 4px;
      outline: none;
      background: #111;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GS <span>GORDINHO STREAMING</span></div>
  </header>

  <!-- PAINEL DE CADASTRO POR LINK -->
  <div class="admin-panel">
    <h2>Adicionar Filme ao Catálogo</h2>
    <div class="form-group">
      <input type="text" id="movieNameInput" placeholder="Nome exato do filme (Ex: Homem-Aranha)">
      <input type="text" id="movieUrlInput" placeholder="Cole o link direto do vídeo (.mp4 ou link de streaming)">
    </div>
    <button onclick="adicionarFilme()">Puxar do TMDb e Adicionar</button>
    <div id="statusMsg"></div>
  </div>

  <!-- CATÁLOGO -->
  <div class="catalog-section">
    <h2>Filmes Disponíveis</h2>
    <div class="movie-grid" id="movieCatalog">
      <!-- Os filmes adicionados aparecem aqui -->
    </div>
  </div>

  <!-- MODAL DO PLAYER -->
  <div class="modal-overlay" id="playerModal">
    <div class="player-box">
      <button class="close-btn" onclick="fecharPlayer()">×</button>
      <h3 id="playingTitle" style="margin-bottom: 15px; color: var(--primary-red);"></h3>
      <video id="mainVideoPlayer" controls autoplay></video>
    </div>
  </div>

  <script>
    // Sua chave do TMDb configurada
    const TMDB_API_KEY = '8e6a4fe3b8b0c240511a0c5cc382ca81';

    // Lista de filmes salva direto no navegador (localStorage para não apagar ao atualizar)
    let listaFilmes = JSON.parse(localStorage.getItem('gs_filmes')) || [];

    // Desenha os filmes na tela ao abrir a página
    window.onload = function() {
      atualizarCatalogo();
    };

    async function adicionarFilme() {
      const nomeFilme = document.getElementById('movieNameInput').value.trim();
      const linkVideo = document.getElementById('movieUrlInput').value.trim();
      const statusMsg = document.getElementById('statusMsg');

      if (!nomeFilme || !linkVideo) {
        alert("Preencha o nome do filme e cole o link do vídeo!");
        return;
      }

      statusMsg.style.display = 'block';
      statusMsg.style.color = '#fff';
      statusMsg.innerText = "Buscando capa e sinopse no TMDb...";

      try {
        // Busca automática no TMDb pelo nome digitado
        const resposta = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(nomeFilme)}`);
        const dados = await resposta.json();

        if (!dados.results || dados.results.length === 0) {
          throw new Error("Filme não encontrado no TMDb. Verifique a digitação.");
        }

        const info = dados.results[0];

        // Monta o objeto do filme
        const novoFilme = {
          id: Date.now(),
          title: info.title,
          poster: info.poster_path ? `https://image.tmdb.org/t/p/w500${info.poster_path}` : 'https://via.placeholder.com/500x750?text=Sem+Capa',
          rating: info.vote_average ? info.vote_average.toFixed(1) : '0.0',
          overview: info.overview || 'Sinopse indisponível.',
          videoUrl: linkVideo
        };

        // Salva na lista e atualiza o armazenamento local
        listaFilmes.push(novoFilme);
        localStorage.setItem('gs_filmes', JSON.stringify(listaFilmes));

        atualizarCatalogo();

        statusMsg.style.color = '#00C851';
        statusMsg.innerText = "Filme adicionado com sucesso!";
        
        // Limpa os campos
        document.getElementById('movieNameInput').value = '';
        document.getElementById('movieUrlInput').value = '';

        setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);

      } catch (erro) {
        statusMsg.style.color = '#E50914';
        statusMsg.innerText = erro.message;
      }
    }

    function atualizarCatalogo() {
      const catalogoDiv = document.getElementById('movieCatalog');
      catalogoDiv.innerHTML = '';

      if (listaFilmes.length === 0) {
        catalogoDiv.innerHTML = '<p style="color: var(--text-gray);">Nenhum filme cadastrado ainda.</p>';
        return;
      }

      listaFilmes.forEach(filme => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => abrirPlayer(filme.title, filme.videoUrl);

        card.innerHTML = `
          <img src="${filme.poster}" alt="${filme.title}">
          <div class="movie-info">
            <div class="movie-title">${filme.title}</div>
            <span class="movie-rating">★ ${filme.rating} / 10</span>
            <div class="movie-desc">${filme.overview}</div>
          </div>
        `;
        catalogoDiv.appendChild(card);
      });
    }

    function abrirPlayer(titulo, url) {
      document.getElementById('playingTitle').innerText = titulo;
      const player = document.getElementById('mainVideoPlayer');
      player.src = url;
      document.getElementById('playerModal').style.display = 'flex';
      player.play();
    }

    function fecharPlayer() {
      const player = document.getElementById('mainVideoPlayer');
      player.pause();
      player.src = '';
      document.getElementById('playerModal').style.display = 'none';
    }
  </script>
</body>
</html>
