<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS - Gordinho Streaming</title>
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: #141414;
      --primary-red: #E50914;
      --hover-red: #B81D24;
      --text-white: #FFFFFF;
      --text-gray: #AAAAAA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding-bottom: 50px;
    }

    header {
      background-color: rgba(0, 0, 0, 0.9);
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-red);
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--text-white);
      font-size: 16px;
      vertical-align: middle;
      margin-left: 5px;
    }

    .search-panel {
      background-color: var(--panel-bg);
      margin: 30px auto;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      border-left: 5px solid var(--primary-red);
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }

    .search-panel h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      background-color: #222;
      border: 1px solid #444;
      color: var(--text-white);
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary-red);
    }

    button {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--hover-red);
    }

    .catalog-section {
      padding: 20px 50px;
    }

    .catalog-section h2 {
      margin-bottom: 20px;
      font-size: 24px;
      border-left: 4px solid var(--primary-red);
      padding-left: 10px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .movie-card {
      background-color: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 1px solid #333;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: var(--primary-red);
    }

    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-rating {
      color: #46d369;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
      display: block;
    }

    .movie-desc {
      font-size: 12px;
      color: var(--text-gray);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal do Player Automático */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .player-box {
      width: 90%;
      max-width: 950px;
      height: 80vh;
      background: #000;
      border: 2px solid var(--primary-red);
      border-radius: 8px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 28px;
      cursor: pointer;
      background: none;
      border: none;
      z-index: 10;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
      background: #111;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GS <span>GORDINHO STREAMING</span></div>
  </header>

  <!-- BUSCA AUTOMÁTICA -->
  <div class="search-panel">
    <h2>Buscar Filme ou Série na Internet</h2>
    <div class="form-group">
      <input type="text" id="searchInput" placeholder="Digite o nome (Ex: Vingadores, Avatar...)">
      <button onclick="buscarFilmeAutomatico()">Pesquisar</button>
    </div>
  </div>

  <!-- CATÁLOGO DE RESULTADOS -->
  <div class="catalog-section">
    <h2>Resultados da Busca</h2>
    <div class="movie-grid" id="movieCatalog">
      <p style="color: var(--text-gray);">Digite um nome acima para procurar automaticamente.</p>
    </div>
  </div>

  <!-- MODAL DO PLAYER EMBED -->
  <div class="modal-overlay" id="playerModal">
    <div class="player-box">
      <button class="close-btn" onclick="fecharPlayer()">×</button>
      <h3 id="playingTitle" style="margin-bottom: 10px; color: var(--primary-red);"></h3>
      <iframe id="videoPlayerFrame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = '8e6a4fe3b8b0c240511a0c5cc382ca81';

    async function buscarFilmeAutomatico() {
      const termo = document.getElementById('searchInput').value.trim();
      const catalogDiv = document.getElementById('movieCatalog');

      if (!termo) {
        alert("Digite o nome de um filme ou série!");
        return;
      }

      catalogDiv.innerHTML = '<p style="color: var(--text-gray);">Pesquisando na web...</p>';

      try {
        // Busca automática no banco de dados global do TMDb
        const resposta = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
        const dados = await resposta.json();

        if (!dados.results || dados.results.length === 0) {
          catalogDiv.innerHTML = '<p style="color: var(--text-gray);">Nenhum resultado encontrado.</p>';
          return;
        }

        catalogDiv.innerHTML = '';

        // Exibe todos os resultados parecidos encontrados na internet
        dados.results.forEach(filme => {
          if (!filme.poster_path) return; // Pula se não tiver capa

          const card = document.createElement('div');
          card.className = 'movie-card';
          
          // ID do TMDb usado para gerar o player de streaming automático via embeds públicos de vídeo
          const tmdbId = filme.id;
          const titulo = filme.title;
          const poster = `https://image.tmdb.org/t/p/w500${filme.poster_path}`;
          const rating = filme.vote_average ? filme.vote_average.toFixed(1) : '0.0';
          const overview = filme.overview || 'Sinopse indisponível.';

          card.onclick = () => abrirPlayerAutomatico(titulo, tmdbId);

          card.innerHTML = `
            <img src="${poster}" alt="${titulo}">
            <div class="movie-info">
              <div class="movie-title">${titulo}</div>
              <span class="movie-rating">★ ${rating} / 10</span>
              <div class="movie-desc">${overview}</div>
            </div>
          `;
          catalogDiv.appendChild(card);
        });

      } catch (erro) {
        catalogDiv.innerHTML = '<p style="color: #E50914;">Erro ao realizar a busca.</p>';
      }
    }

        function abrirPlayerAutomatico(titulo, idFilme) {
      document.getElementById('playingTitle').innerText = titulo;
      const iframe = document.getElementById('videoPlayerFrame');
      
      // Usando uma rota de embed alternativa e mais estável
      iframe.src = `https://vidsrc.me/embed/movie?tmdb=${idFilme}`;
      
      document.getElementById('playerModal').style.display = 'flex';
    }
    

  </script>
</body>
</html>
