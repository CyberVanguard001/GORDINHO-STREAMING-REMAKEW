<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS - Gordinho Streaming</title>
  <style>
    /* Reset e Variáveis */
    :root {
      --bg-color: #000000;
      --panel-bg: #141414;
      --primary-red: #E50914;
      --hover-red: #B81D24;
      --text-white: #FFFFFF;
      --text-gray: #AAAAAA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
    }

    /* Cabeçalho */
    header {
      background-color: rgba(0, 0, 0, 0.9);
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-red);
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--text-white);
      font-size: 16px;
      vertical-align: middle;
      margin-left: 5px;
    }

    /* Painel de Upload (Administração) */
    .admin-panel {
      background-color: var(--panel-bg);
      margin: 30px auto;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      border-left: 5px solid var(--primary-red);
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }

    .admin-panel h2 {
      margin-bottom: 20px;
      font-size: 22px;
    }

    .form-group {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    input[type="text"], input[type="file"] {
      flex: 1;
      padding: 12px;
      background-color: #222;
      border: 1px solid #444;
      color: var(--text-white);
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary-red);
    }

    button {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--hover-red);
    }

    #uploadStatus {
      margin-top: 10px;
      font-size: 14px;
      color: #00C851;
      display: none;
    }

    /* Catálogo de Filmes */
    .catalog-section {
      padding: 20px 50px;
    }

    .catalog-section h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .movie-card {
      background-color: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
      position: relative;
    }

    .movie-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(229, 9, 20, 0.4);
    }

    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-gray);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .movie-rating {
      color: #46d369; /* Verde estilo Netflix para relevância */
      font-weight: bold;
    }

    .movie-desc {
      font-size: 12px;
      color: var(--text-gray);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal do Player */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .player-box {
      width: 90%;
      max-width: 900px;
      background: #000;
      border: 2px solid var(--primary-red);
      border-radius: 8px;
      padding: 20px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: var(--text-white);
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    video {
      width: 100%;
      border-radius: 4px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GS <span>GORDINHO STREAMING</span></div>
  </header>

  <!-- PAINEL DE UPLOAD -->
  <div class="admin-panel">
    <h2>Adicionar Novo Filme</h2>
    <div class="form-group">
      <input type="text" id="movieSearchName" placeholder="Ex: Vingadores Ultimato">
      <input type="file" id="movieVideoFile" accept="video/*">
    </div>
    <button onclick="processMovieUpload()">Buscar no TMDb e Fazer Upload</button>
    <div id="uploadStatus">Processando... Aguarde.</div>
  </div>

  <!-- CATÁLOGO -->
  <div class="catalog-section">
    <h2>Meus Filmes</h2>
    <div class="movie-grid" id="movieCatalog">
      <!-- Os filmes adicionados aparecerão aqui -->
    </div>
  </div>

  <!-- MODAL DO PLAYER -->
  <div class="modal-overlay" id="playerModal">
    <div class="player-box">
      <button class="close-btn" onclick="closePlayer()">×</button>
      <h3 id="playingTitle" style="margin-bottom: 15px; color: var(--primary-red);"></h3>
      <video id="mainVideoPlayer" controls></video>
    </div>
  </div>

  <script>
    // COLOCAR SUA CHAVE DO TMDB AQUI
    const TMDB_API_KEY = 'SUA_CHAVE_AQUI'; 

    // Array para guardar os filmes na sessão
    let myMovies = [];

    async function processMovieUpload() {
      const searchName = document.getElementById('movieSearchName').value;
      const videoFile = document.getElementById('movieVideoFile').files[0];
      const statusText = document.getElementById('uploadStatus');

      if (!searchName || !videoFile) {
        alert("Preencha o nome do filme e selecione um arquivo de vídeo!");
        return;
      }

      statusText.style.display = 'block';
      statusText.style.color = '#fff';
      statusText.innerText = "Buscando informações no TMDb...";

      try {
        // 1. Busca os dados no TMDb
        const tmdbResponse = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(searchName)}`);
        const tmdbData = await tmdbResponse.json();

        if (!tmdbData.results || tmdbData.results.length === 0) {
          alert("Filme não encontrado no TMDb. Verifique o nome.");
          statusText.style.display = 'none';
          return;
        }

        const movieInfo = tmdbData.results[0]; // Pega o primeiro resultado

        // 2. Lógica de Upload do Vídeo
        // Para testes locais na tela, criamos uma URL temporária.
        // É AQUI que você deve integrar o script do Firebase Storage para hospedar o arquivo na nuvem.
        statusText.innerText = "Simulando Upload do Vídeo...";
        const videoUrl = URL.createObjectURL(videoFile); 

        /* 
          EXEMPLO DE INTEGRAÇÃO FIREBASE (Descomente e configure no seu projeto):
          const storageRef = firebase.storage().ref('filmes/' + videoFile.name);
          await storageRef.put(videoFile);
          const videoUrl = await storageRef.getDownloadURL(); 
        */

        // 3. Monta o Objeto do Filme
        const newMovie = {
          id: Date.now(),
          title: movieInfo.title,
          poster: `https://image.tmdb.org/t/p/w500${movieInfo.poster_path}`,
          rating: movieInfo.vote_average.toFixed(1),
          overview: movieInfo.overview,
          videoSrc: videoUrl
        };

        // 4. Adiciona ao catálogo e limpa o formulário
        myMovies.push(newMovie);
        renderCatalog();
        
        statusText.style.color = '#00C851';
        statusText.innerText = "Upload concluído! Filme adicionado ao catálogo.";
        document.getElementById('movieSearchName').value = '';
        document.getElementById('movieVideoFile').value = '';

        setTimeout(() => { statusText.style.display = 'none'; }, 3000);

      } catch (error) {
        console.error("Erro:", error);
        statusText.style.color = 'red';
        statusText.innerText = "Ocorreu um erro no processamento.";
      }
    }

    function renderCatalog() {
      const catalog = document.getElementById('movieCatalog');
      catalog.innerHTML = '';

      myMovies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.onclick = () => openPlayer(movie.title, movie.videoSrc);
        
        card.innerHTML = `
          <img src="${movie.poster}" alt="${movie.title}">
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-meta">
              <span class="movie-rating">${movie.rating * 10}% Relevante</span>
            </div>
            <div class="movie-desc">${movie.overview || 'Sinopse não disponível.'}</div>
          </div>
        `;
        catalog.appendChild(card);
      });
    }

    function openPlayer(title, src) {
      document.getElementById('playingTitle').innerText = title;
      const player = document.getElementById('mainVideoPlayer');
      player.src = src;
      document.getElementById('playerModal').style.display = 'flex';
      player.play();
    }

    function closePlayer() {
      const player = document.getElementById('mainVideoPlayer');
      player.pause();
      player.src = ''; // Limpa o vídeo para economizar memória
      document.getElementById('playerModal').style.display = 'none';
    }
  </script>
</body>
</html>
