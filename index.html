<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GS - Gordinho Streaming</title>
  <style>
    :root {
      --bg-color: #000000;
      --panel-bg: #141414;
      --primary-red: #E50914;
      --hover-red: #B81D24;
      --text-white: #FFFFFF;
      --text-gray: #AAAAAA;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-white);
      padding-bottom: 50px;
    }

    header {
      background-color: rgba(0, 0, 0, 0.95);
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--primary-red);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: var(--primary-red);
      letter-spacing: 2px;
    }

    .logo span {
      color: var(--text-white);
      font-size: 16px;
      vertical-align: middle;
      margin-left: 5px;
    }

    .search-panel {
      background-color: var(--panel-bg);
      margin: 30px auto;
      max-width: 800px;
      padding: 30px;
      border-radius: 8px;
      border-left: 5px solid var(--primary-red);
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    }

    .search-panel h2 {
      margin-bottom: 15px;
      font-size: 20px;
    }

    .form-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      background-color: #222;
      border: 1px solid #444;
      color: var(--text-white);
      border-radius: 4px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary-red);
    }

    button {
      background-color: var(--primary-red);
      color: var(--text-white);
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: var(--hover-red);
    }

    .catalog-section {
      padding: 20px 50px;
    }

    .catalog-section h2 {
      margin-bottom: 20px;
      font-size: 24px;
      border-left: 4px solid var(--primary-red);
      padding-left: 10px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .movie-card {
      background-color: var(--panel-bg);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 1px solid #333;
    }

    .movie-card:hover {
      transform: scale(1.05);
      border-color: var(--primary-red);
    }

    .movie-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .movie-info {
      padding: 15px;
    }

    .movie-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-rating {
      color: #46d369;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 8px;
      display: block;
    }

    .movie-desc {
      font-size: 12px;
      color: var(--text-gray);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Modal do Player com Bloqueio de Anúncios */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.96);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .player-box {
      width: 92%;
      max-width: 1000px;
      height: 82vh;
      background: #000;
      border: 2px solid var(--primary-red);
      border-radius: 8px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .server-selector {
      display: flex;
      gap: 8px;
    }

    .server-btn {
      background-color: #222;
      color: #fff;
      border: 1px solid #444;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    .server-btn.active {
      background-color: var(--primary-red);
      border-color: var(--primary-red);
    }

    .close-btn {
      color: var(--text-white);
      font-size: 26px;
      cursor: pointer;
      background: none;
      border: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
      background: #111;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">GS <span>GORDINHO STREAMING</span></div>
  </header>

  <!-- PAINEL DE PESQUISA -->
  <div class="search-panel">
    <h2>Explorar Filmes e Séries (PT-BR)</h2>
    <div class="form-group">
      <input type="text" id="searchInput" placeholder="Digite o nome (Ex: Vingadores, Batman...)">
      <button onclick="pesquisarMidia()">Pesquisar</button>
    </div>
  </div>

  <!-- CATÁLOGO -->
  <div class="catalog-section">
    <h2>Resultados da Busca</h2>
    <div class="movie-grid" id="movieCatalog">
      <p style="color: var(--text-gray);">Digite um nome acima para buscar.</p>
    </div>
  </div>

  <!-- MODAL DO PLAYER -->
  <div class="modal-overlay" id="playerModal">
    <div class="player-box">
      <div class="player-header">
        <h3 id="playingTitle" style="color: var(--primary-red); font-size: 1.1rem;">Carregando...</h3>
        <div class="server-selector">
          <button class="server-btn active" onclick="trocarServidor(1)">Opção 1</button>
          <button class="server-btn" onclick="trocarServidor(2)">Opção 2</button>
          <button class="server-btn" onclick="trocarServidor(3)">Opção 3</button>
        </div>
        <button class="close-btn" onclick="fecharPlayer()">×</button>
      </div>
      <!-- Atributo sandbox ativado para bloquear pop-ups de anúncios -->
      <iframe id="videoPlayerFrame" src="" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const TMDB_API_KEY = '8e6a4fe3b8b0c240511a0c5cc382ca81';
    let currentTmdbId = null;
    let currentMediaType = 'movie';

    async function pesquisarMidia() {
      const termo = document.getElementById('searchInput').value.trim();
      const catalogDiv = document.getElementById('movieCatalog');

      if (!termo) {
        alert("Por favor, digite o nome de um filme ou série.");
        return;
      }

      catalogDiv.innerHTML = '<p style="color: var(--text-gray);">Buscando conteúdo...</p>';

      try {
        const resposta = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(termo)}`);
        const dados = await resposta.json();

        const resultados = dados.results.filter(item => (item.media_type === 'movie' || item.media_type === 'tv') && item.poster_path);

        if (resultados.length === 0) {
          catalogDiv.innerHTML = '<p style="color: var(--text-gray);">Nenhum resultado encontrado.</p>';
          return;
        }

        catalogDiv.innerHTML = '';

        resultados.forEach(item => {
          const card = document.createElement('div');
          card.className = 'movie-card';
          
          const id = item.id;
          const titulo = item.title || item.name;
          const poster = `https://image.tmdb.org/t/p/w500${item.poster_path}`;
          const rating = item.vote_average ? item.vote_average.toFixed(1) : '0.0';
          const overview = item.overview || 'Sinopse não disponível.';
          const tipo = item.media_type;

          card.onclick = () => abrirPlayer(titulo, id, tipo);

          card.innerHTML = `
            <img src="${poster}" alt="${titulo}">
            <div class="movie-info">
              <div class="movie-title">${titulo}</div>
              <span class="movie-rating">★ ${rating} / 10</span>
              <div class="movie-desc">${overview}</div>
            </div>
          `;
          catalogDiv.appendChild(card);
        });

      } catch (erro) {
        catalogDiv.innerHTML = '<p style="color: #E50914;">Erro ao conectar com a base de dados.</p>';
      }
    }

    function abrirPlayer(titulo, id, tipo) {
      currentTmdbId = id;
      currentMediaType = tipo;
      
      document.getElementById('playingTitle').innerText = titulo;
      trocarServidor(1);
      document.getElementById('playerModal').style.display = 'flex';
    }

    function trocarServidor(opcao) {
      const botoes = document.querySelectorAll('.server-btn');
      botoes.forEach((btn, index) => {
        if (index + 1 === opcao) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const iframe = document.getElementById('videoPlayerFrame');
      
      // Rotas alternativas focadas em players limpos baseados no ID do TMDb
      if (opcao === 1) {
        // MultiEmbed Principal com suporte a áudio pt
        iframe.src = `https://multiembed.mov/?tmdb=1&${currentMediaType === 'movie' ? 'video_id' : 'tv'}=${currentTmdbId}&s=1&e=1`;
      } else if (opcao === 2) {
        // SuperEmbed alternativo
        iframe.src = `https://apanha.cc/embed/${currentMediaType}/${currentTmdbId}`;
      } else {
        // O Servidor que funcionou para você anteriormente (MultiEmbed genérico)
        iframe.src = `https://multiembed.mov/?video_id=${currentTmdbId}&tmdb=1`;
      }
    }

    function fecharPlayer() {
      const iframe = document.getElementById('videoPlayerFrame');
      iframe.src = '';
      document.getElementById('playerModal').style.display = 'none';
    }
  </script>
</body>
</html>
